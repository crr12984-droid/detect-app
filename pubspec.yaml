name: detect_app
description: 智能终端检测定位系统（真实 WiFi / 蓝牙扫描）
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 真实蓝牙低功耗扫描
  flutter_blue_plus: '>=1.32.0 <2.0.0'
  # 真实 WiFi 扫描（getScanResults）
  wifi_scan: ^0.4.1
  # 运行时权限（位置 / 蓝牙）
  permission_handler: '>=11.0.0 <13.0.0'
  # 检测系统“定位服务/GPS”是否开启（安卓 11- 关闭会导致扫描为空）
  geolocator: ^13.0.0
  # 渲染品牌 / 品类 / UI 图标 SVG（来自原始原型资源）
  flutter_svg: ^2.0.0
  # 报告导出写入外部存储
  path_provider: ^2.1.0
  # 读取真实电量（5.x 内部 compileSdk 固定 33，导致 AAR 元数据校验失败；6.x 起 compileSdk>=34）
  battery_plus: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: '>=3.0.0 <7.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/brands/
    - assets/icons/
